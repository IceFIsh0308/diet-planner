<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🚀 GitHub Pages 部署工具 V2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#F5F7FA;color:#1A1A2E;padding:20px;min-height:100vh;display:flex;justify-content:center}
.app{max-width:1100px;width:100%}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:22px;color:#2D8B46}
.header p{font-size:13px;color:#6B7280;margin-top:4px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#374151}
.status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px}
.status-idle{background:#F3F4F6;color:#6B7280}
.status-ok{background:#D1FAE5;color:#059669}
.status-err{background:#FEE2E2;color:#DC2626}
.status-warn{background:#FEF3C7;color:#D97706}
.status-run{background:#DBEAFE;color:#2563EB}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.file-drop{border:2px dashed #D1D5DB;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.file-drop:hover{border-color:#2D8B46;background:#F0FDF4}
.file-drop.dragover{border-color:#2D8B46;background:#E8F5E9}
.file-drop .icon{font-size:28px;margin-bottom:8px}
.file-drop p{color:#6B7280;font-size:13px}
.file-info{display:none;margin-top:12px;padding:12px;background:#F9FAFB;border-radius:8px;font-size:13px}
.file-info.show{display:block}
.file-info .row{display:flex;justify-content:space-between;margin:4px 0}
.file-info .label{color:#6B7280}
.file-info .value{font-weight:600}
.checks{margin-top:12px}
.check-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.check-item .icon{width:20px;text-align:center}
.check-ok{color:#2D8B46}.check-fail{color:#DC2626}.check-pending{color:#9CA3AF}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#2D8B46;color:#fff}
.btn-primary:hover{background:#246B38}
.btn-primary:disabled{background:#D1D5DB;cursor:not-allowed}
.btn-secondary{background:#F3F4F6;color:#374151}
.btn-secondary:hover{background:#E5E7EB}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.log{background:#1F2937;color:#D1D5DB;border-radius:8px;padding:12px;font-size:12px;font-family:'SF Mono',Monaco,monospace;max-height:360px;overflow-y:auto;margin-top:12px;display:none}
.log.show{display:block}
.log .line{margin:2px 0;white-space:pre-wrap}
.log-ok{color:#4ADE80}.log-warn{color:#FBBF24}.log-err{color:#F87171}.log-info{color:#60A5FA}
.config-panel{background:#F9FAFB;padding:12px;border-radius:8px;margin-bottom:12px}
.config-panel label{display:block;font-size:12px;color:#6B7280;margin:6px 0 2px}
.config-panel input,.config-panel select{width:100%;padding:6px 10px;border:1.5px solid #E5E7EB;border-radius:6px;font-size:13px;background:#fff}
.config-panel select{cursor:pointer}
.config-panel .hint{font-size:11px;color:#9CA3AF;margin-top:4px}
.config-panel .refresh-btn{display:inline-block;margin-left:6px;font-size:11px;color:#2D8B46;cursor:pointer;text-decoration:underline}
.token-section{background:#FEF3C7;padding:12px;border-radius:8px;margin-bottom:16px}
.token-section label{display:block;font-size:12px;color:#92400E;margin-bottom:4px}
.token-section input{width:100%;padding:8px 10px;border:1.5px solid #FCD34D;border-radius:6px;font-size:13px;margin-bottom:6px}
.token-section .hint{font-size:11px;color:#92400E}
.token-section a{color:#92400E;font-size:11px}
.token-ok{color:#059669;font-size:12px;margin-top:4px;display:none}
.token-ok.show{display:block}
.step-indicator{display:flex;align-items:center;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.step{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.step-done{background:#D1FAE5;color:#059669}
.step-current{background:#DBEAFE;color:#2563EB}
.step-pending{background:#F3F4F6;color:#9CA3AF}
.step-arrow{color:#D1D5DB;font-size:12px}
.three-col{display:flex;gap:14px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.three-col{flex-direction:column}.col{flex:1 1 100%}}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>🚀 GitHub Pages 部署工具 V2.0</h1><p>从零到上线，浏览器一键完成</p></div>
<div id="stepBar" class="step-indicator">
<span class="step step-pending" id="step1">1. Token</span><span class="step-arrow">→</span>
<span class="step step-pending" id="step2">2. 配置</span><span class="step-arrow">→</span>
<span class="step step-pending" id="step3">3. 选文件</span><span class="step-arrow">→</span>
<span class="step step-pending" id="step4">4. 校验</span><span class="step-arrow">→</span>
<span class="step step-pending" id="step5">5. 部署</span>
</div>
<div id="statusBar" class="status-bar status-idle"><span>⏳ 请填写 Token 开始</span></div>
<div class="three-col">
<div class="col">
<div class="card">
<div class="card-title">⚙️ 部署配置</div>
<div class="config-panel">
<label>🔑 GitHub Token</label>
<input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
<div class="hint">生成：<a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> → 勾选 repo → Generate</div>
<div class="token-ok" id="tokenOk">✅ Token 有效</div>
<label>GitHub 用户名 <span class="refresh-btn" id="btnFetchRepos" style="display:none">刷新</span></label>
<input type="text" id="cfgOwner" placeholder="自动获取" readonly />
<label>仓库</label>
<select id="cfgRepo" disabled><option>请先输入 Token</option></select>
<label>分支</label>
<select id="cfgBranch" disabled><option>请先选择仓库</option></select>
<label>部署文件路径</label>
<select id="cfgPath" disabled><option>请先选择分支</option></select>
<label>Pages 访问地址</label>
<input type="text" id="cfgPages" placeholder="自动生成" />
<p class="hint">仓库不存在会自动创建</p>
</div>
</div>
</div>
<div class="col">
<div class="card">
<div class="card-title">📦 选择文件</div>
<div class="file-drop" id="fileDrop"><div class="icon">📁</div><p>点击选择或拖拽 HTML 文件</p><p style="font-size:11px;color:#9CA3AF;margin-top:4px">任意 HTML 文件</p></div>
<input type="file" id="fileInput" accept=".html" style="display:none" />
<div class="file-info" id="fileInfo">
<div class="row"><span class="label">文件名</span><span class="value" id="infoName">-</span></div>
<div class="row"><span class="label">大小</span><span class="value" id="infoSize">-</span></div>
<div class="row"><span class="label">行数</span><span class="value" id="infoLines">-</span></div>
<div class="row"><span class="label">版本</span><span class="value" id="infoVersion">-</span></div>
</div>
</div>
<div class="card">
<div class="card-title">📝 部署说明</div>
<input type="text" id="commitMsg" placeholder="本次更新说明" style="width:100%;padding:8px 12px;border:1.5px solid #E5E7EB;border-radius:6px;font-size:13px;margin-bottom:12px" />
</div>
</div>
<div class="col">
<div class="card" id="checkCard" style="display:none"><div class="card-title">🔍 部署前校验</div><div class="checks" id="checks"></div></div>
<div class="card">
<div class="card-title">🚀 部署</div>
<div class="actions"><button class="btn btn-secondary" onclick="resetAll()">重置</button><button class="btn btn-primary" id="deployBtn" disabled onclick="deploy()">🚀 确认部署</button></div>
</div>
<div class="log" id="logBox"></div>
<div style="text-align:center;font-size:12px;color:#9CA3AF">Pages 1-2 分钟自动更新</div>
</div>
</div>
</div>
<script>
const CK='github_pages_deploy_v3';
function loadCfg(){try{return JSON.parse(localStorage.getItem(CK)||'{}')}catch{return{}}}
function saveCfg(c){localStorage.setItem(CK,JSON.stringify(c))}
const saved=loadCfg();
let ghToken='',repoList=[],branchList=[],fileList=[];
let fileContent=null,fileName='',checksPassed=false;
function markStep(n){for(let i=1;i<=5;i++){const el=document.getElementById('step'+i);if(i<n)el.className='step step-done';else if(i===n)el.className='step step-current';else el.className='step step-pending'}}
function setStatus(c,t,sp){const b=document.getElementById('statusBar');b.className='status-bar '+c;b.innerHTML=(sp?'<span class="spinner"></span>':'')+'<span>'+t+'</span>'}
function log(m,t){const b=document.getElementById('logBox');b.classList.add('show');const l=document.createElement('div');l.className='line log-'+(t||'info');l.textContent=m;b.appendChild(l);b.scrollTop=b.scrollHeight}
let tokenTimer=null;
document.getElementById('githubToken').addEventListener('input',function(){
  const v=this.value.trim();
  if(v.length>10){document.getElementById('tokenOk').classList.remove('show');clearTimeout(tokenTimer);tokenTimer=setTimeout(()=>verifyTokenAndFetchRepos(v),600)}
});
async function ghApi(path,method,body){
  const headers={'Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'};
  if(method==='PUT'||method==='POST')headers['Content-Type']='application/json';
  const opts={method:method||'GET',headers};if(body)opts.body=JSON.stringify(body);
  const r=await fetch('https://api.github.com'+path,opts);
  const d=await r.json().catch(()=>({}));return{status:r.status,data:d}
}
async function verifyTokenAndFetchRepos(token){
  ghToken=token;setStatus('status-run','正在验证 Token...',true);
  try{
    const r=await ghApi('/user');
    if(r.status!==200)throw new Error('Token 无效');
    document.getElementById('cfgOwner').value=r.data.login;
    setStatus('status-run','正在加载仓库列表...',true);
    const repoResp=await ghApi('/user/repos?per_page=100&sort=updated&direction=desc');
    if(repoResp.status===200){
      repoList=repoResp.data.map(r=>({name:r.name,private:r.private,has_pages:r.has_pages,default_branch:r.default_branch}));
      renderRepoList();document.getElementById('tokenOk').classList.add('show');
      document.getElementById('btnFetchRepos').style.display='inline';markStep(2);
      if(saved.repo&&repoList.find(r=>r.name===saved.repo)){document.getElementById('cfgRepo').value=saved.repo;await onRepoChange()}
      setStatus('status-ok','✅ Token 有效，已加载 '+repoList.length+' 个仓库');
    }else{
      console.error('仓库列表API返回:',repoResp.status,repoResp.data);
      throw new Error('获取仓库列表失败: '+(repoResp.data.message||repoResp.status));
    }
  }catch(e){console.error('Token验证失败:',e);setStatus('status-err','❌ '+e.message);document.getElementById('tokenOk').classList.remove('show')}
}
function renderRepoList(){
  const sel=document.getElementById('cfgRepo');sel.disabled=false;
  sel.innerHTML='<option value="">-- 选择仓库 --</option>'+repoList.map(r=>`<option value="${r.name}">${r.name}${r.private?' (私有)':''}${r.has_pages?' · Pages':''}</option>`).join('');
  sel.innerHTML+='<option value="__new__">+ 新建仓库...</option>';
}
document.getElementById('btnFetchRepos').addEventListener('click',()=>verifyTokenAndFetchRepos(ghToken));
async function onRepoChange(){
  const sel=document.getElementById('cfgRepo');const repo=sel.value;
  if(!repo){document.getElementById('cfgBranch').disabled=true;document.getElementById('cfgPath').disabled=true;updatePagesUrl();return}
  if(repo==='__new__'){
    const newName=prompt('输入新仓库名称:');
    if(newName){
      setStatus('status-run','正在创建仓库...',true);
      const r=await ghApi('/user/repos','POST',{name:newName,description:'GitHub Pages 网站',auto_init:true,public:true});
      if(r.status===201){setStatus('status-ok','✅ 仓库 '+newName+' 已创建');await verifyTokenAndFetchRepos(ghToken);document.getElementById('cfgRepo').value=newName;await onRepoChange()}
      else setStatus('status-err','❌ 创建失败: '+(r.data.message||'未知'));
    }else{sel.value='';}updatePagesUrl();return;
  }
  setStatus('status-run','正在加载分支...',true);
  const br=await ghApi('/repos/'+document.getElementById('cfgOwner').value+'/'+repo+'/branches?per_page=100');
  if(br.status===200){
    branchList=br.data.map(b=>b.name);
    const brSel=document.getElementById('cfgBranch');brSel.disabled=false;
    brSel.innerHTML=branchList.map(b=>`<option value="${b}">${b}</option>`).join('');
    const repoInfo=repoList.find(r=>r.name===repo);
    const defaultBr=saved.branch&&branchList.includes(saved.branch)?saved.branch:(repoInfo?repoInfo.default_branch:'main');
    if(defaultBr&&branchList.includes(defaultBr))brSel.value=defaultBr;
    await onBranchChange();setStatus('status-ok','✅ 已加载 '+branchList.length+' 个分支');
  }else{
    setStatus('status-warn','⚠️ 获取分支失败');document.getElementById('cfgBranch').disabled=false;
    document.getElementById('cfgBranch').innerHTML='<option value="main">main</option>';
  }
  updatePagesUrl();
}
async function onBranchChange(){
  const repo=document.getElementById('cfgRepo').value;const branch=document.getElementById('cfgBranch').value;
  if(!repo||!branch){document.getElementById('cfgPath').disabled=true;return}
  setStatus('status-run','正在加载文件列表...',true);
  const tree=await ghApi('/repos/'+document.getElementById('cfgOwner').value+'/'+repo+'/git/trees/'+branch+'?recursive=1');
  if(tree.status===200&&tree.data.tree){
    fileList=tree.data.tree.filter(f=>f.type==='blob'&&f.path.endsWith('.html')).map(f=>f.path);
    const pathSel=document.getElementById('cfgPath');pathSel.disabled=false;
    if(fileList.length===0){pathSel.innerHTML='<option value="index.html">index.html (新文件)</option>'}
    else{
      pathSel.innerHTML=fileList.map(p=>`<option value="${p}">${p}</option>`).join('');
      if(fileList.includes('index.html'))pathSel.value='index.html';else pathSel.value=fileList[0];
    }
    if(saved.path&&fileList.includes(saved.path))pathSel.value=saved.path;
    setStatus('status-ok','✅ 已加载 '+fileList.length+' 个 HTML 文件');
  }else{
    document.getElementById('cfgPath').disabled=false;
    document.getElementById('cfgPath').innerHTML='<option value="index.html">index.html (新文件)</option>';
    setStatus('status-warn','⚠️ 仓库为空或获取失败');
  }
  saveCurrentConfig();
}
document.getElementById('cfgRepo').addEventListener('change',onRepoChange);
document.getElementById('cfgBranch').addEventListener('change',onBranchChange);
document.getElementById('cfgPath').addEventListener('change',saveCurrentConfig);
function saveCurrentConfig(){saveCfg({token:ghToken,owner:document.getElementById('cfgOwner').value,repo:document.getElementById('cfgRepo').value,branch:document.getElementById('cfgBranch').value,path:document.getElementById('cfgPath').value,pages:document.getElementById('cfgPages').value})}
function updatePagesUrl(){const o=document.getElementById('cfgOwner').value.trim(),r=document.getElementById('cfgRepo').value.trim();if(o&&r&&r!=='__new__'){const url='https://'+o.toLowerCase()+'.github.io/'+r+'/';const cur=document.getElementById('cfgPages').value;if(!cur||cur.startsWith('https://'))document.getElementById('cfgPages').value=url}}
document.getElementById('cfgPages').addEventListener('input',saveCurrentConfig);
if(saved.token){document.getElementById('githubToken').value=saved.token;verifyTokenAndFetchRepos(saved.token)}
if(saved.pages)document.getElementById('cfgPages').value=saved.pages;
const fd=document.getElementById('fileDrop'),fi=document.getElementById('fileInput');
fd.addEventListener('click',()=>fi.click());
fd.addEventListener('dragover',e=>{e.preventDefault();fd.classList.add('dragover')});
fd.addEventListener('dragleave',()=>fd.classList.remove('dragover'));
fd.addEventListener('drop',e=>{e.preventDefault();fd.classList.remove('dragover');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
fi.addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0])});
function handleFile(f){
  if(!f.name.endsWith('.html')){alert('请选择 HTML 文件');return}
  fileName=f.name;fileContent=null;checksPassed=false;document.getElementById('deployBtn').disabled=true;
  setStatus('status-warn','正在读取文件...');
  const r=new FileReader();
  r.onload=function(e){
    fileContent=e.target.result;
    const sz=(f.size/1024).toFixed(1),ln=fileContent.split('\n').length,vm=fileContent.match(/V(\d+)/),ver=vm?'V'+vm[1]:'未检测到';
    document.getElementById('infoName').textContent=f.name;document.getElementById('infoSize').textContent=sz+' KB';
    document.getElementById('infoLines').textContent=ln+' 行';document.getElementById('infoVersion').textContent=ver;
    document.getElementById('fileInfo').classList.add('show');document.getElementById('checkCard').style.display='block';
    if(!document.getElementById('commitMsg').value)document.getElementById('commitMsg').value='部署 '+ver;
    markStep(3);runChecks(fileContent)
  };r.readAsText(f)
}
function runChecks(content){
  const isHtml=content.includes('<!DOCTYPE html>')||content.includes('<html');
  const hasScript=content.includes('<scr'+'ipt')||content.includes('<scr'+'ipt'),hasStyle=content.includes('<style')||content.includes('<link');
  const checks=[
    {n:'HTML 文件结构',t:()=>isHtml},
    {n:'包含 JavaScript',t:()=>hasScript},
    {n:'包含样式（CSS）',t:()=>hasStyle},
    {n:'HTML 闭合标签',t:()=>content.includes('</html>')||content.includes('</body>')},
    {n:'JS 语法检查',t:()=>{
      const lt=String.fromCharCode(60);
      const re=new RegExp(lt+'script(?:\\s[^>]*)?>([\\s\\S]*?)'+lt+'\\/script>','g');
      const s=content.match(re)||[];let hasCode=false;
      for(const x of s){const m=x.match(new RegExp(lt+'script(?:\\s[^>]*)?>([\\s\\S]*?)'+lt+'\\/script>'));const code=m&&m[1]?m[1]:'';if(code.trim().length>50){hasCode=true;try{new Function(code)}catch(e){return false}}}
      return hasCode||s.length>0;
    }},
  ];
  if(content.includes('supabase')||content.includes('饮食规划')){
    checks.push({n:'Supabase SDK 引入',t:()=>content.includes('supabase-js')&&content.includes('supabase.createClient')});
    checks.push({n:'云端同步逻辑',t:()=>content.includes('loadFromCloud')&&content.includes('saveAll')});
    checks.push({n:'拖动同步',t:()=>content.includes('handleFoodDrop')});
  }
  const c=document.getElementById('checks');c.innerHTML='';let allPass=true;
  checks.forEach((ck,i)=>{
    const el=document.createElement('div');el.className='check-item check-pending';
    el.innerHTML='<span class="icon">⏳</span><span>'+ck.n+'</span>';c.appendChild(el);
    setTimeout(()=>{
      const p=ck.t();el.className='check-item '+(p?'check-ok':'check-fail');el.querySelector('.icon').textContent=p?'✅':'❌';
      if(!p)allPass=false;
      if(i===checks.length-1){markStep(4);if(allPass){setStatus('status-ok','✅ 校验通过，可以部署');document.getElementById('deployBtn').disabled=false;checksPassed=true}else{setStatus('status-err','❌ 校验失败，请修复后再部署');document.getElementById('deployBtn').disabled=true}}
    },50*(i+1))
  });
}
async function deploy(){
  if(!checksPassed||!fileContent)return;
  const owner=document.getElementById('cfgOwner').value.trim(),repo=document.getElementById('cfgRepo').value.trim();
  const path=document.getElementById('cfgPath').value.trim()||'index.html',branch=document.getElementById('cfgBranch').value.trim()||'main';
  const pagesUrl=document.getElementById('cfgPages').value.trim(),msg=document.getElementById('commitMsg').value.trim()||'部署更新';
  if(!ghToken){alert('请填写 GitHub Token');return}
  if(!owner||!repo||repo==='__new__'){alert('请选择仓库');return}
  saveCurrentConfig();markStep(5);setStatus('status-run','🚀 正在部署...',true);
  document.getElementById('deployBtn').disabled=true;document.getElementById('logBox').innerHTML='';
  log('🚀 开始部署...','info');log('文件: '+fileName,'info');log('说明: '+msg,'info');
  log('目标: '+owner+'/'+repo+'/'+path+' ('+branch+')','info');log('','info');
  try{
    log('📡 检查仓库 '+owner+'/'+repo+'...','info');
    let repoResp=await ghApi('/repos/'+owner+'/'+repo);
    if(repoResp.status===404){
      log('📦 仓库不存在，正在创建...','warn');
      const cr=await ghApi('/user/repos','POST',{name:repo,description:'GitHub Pages 网站',auto_init:true,public:true});
      if(cr.status===201){log('✅ 仓库创建成功','ok');await new Promise(r=>setTimeout(r,2000))}
      else throw new Error('创建仓库失败: '+(cr.data.message||cr.status));
    }else if(repoResp.status===200)log('✅ 仓库已存在','ok');
    else throw new Error('检查仓库失败: '+(repoResp.data.message||repoResp.status));
    log('📡 检查 GitHub Pages 设置...','info');
    const pr=await ghApi('/repos/'+owner+'/'+repo+'/pages');
    if(pr.status===404){
      log('⚙️ 启用 GitHub Pages...','warn');
      const er=await ghApi('/repos/'+owner+'/'+repo+'/pages','POST',{source:{branch:branch,path:'/'}});
      if(er.status===201)log('✅ GitHub Pages 已启用','ok');
      else if(er.status===409)log('ℹ️ Pages 可能已在启用中','warn');
      else log('⚠️ 启用 Pages: '+(er.data.message||'未知'),'warn');
    }else if(pr.status===200)log('✅ GitHub Pages 已启用','ok');
    else log('⚠️ Pages 检查: HTTP '+pr.status,'warn');
    const apiBase='/repos/'+owner+'/'+repo+'/contents/'+encodeURIComponent(path);
    log('📡 获取文件信息...','info');let sha=null;
    const gr=await ghApi(apiBase+'?ref='+branch);
    if(gr.status===200){sha=gr.data.sha;log('✅ 找到已有文件 (SHA: '+sha.substring(0,8)+')','ok')}
    else if(gr.status===404)log('ℹ️ 新文件，将创建','warn');
    else throw new Error('获取失败: '+(gr.data.message||gr.status));
    const b64=btoa(unescape(encodeURIComponent(fileContent)));
    log('✅ 文件已编码 ('+(b64.length/1024).toFixed(1)+' KB)','ok');
    log('🚀 推送到 GitHub...','info');
    const pr2=await ghApi(apiBase,'PUT',{message:msg,content:b64,branch,sha});
    if(pr2.status===200||pr2.status===201){
      log('✅ 推送成功！','ok');log('📝 Commit: '+pr2.data.commit.sha.substring(0,8),'ok');log('','info');
      const pu=pagesUrl||('https://'+owner.toLowerCase()+'.github.io/'+repo+'/');
      log('🌐 访问地址: '+pu,'ok');log('⏳ GitHub Pages 1-2 分钟后自动更新','info');
      setStatus('status-ok','✅ 部署成功！');log('','info');log('🎉 部署完成！','ok');
    }else throw new Error(pr2.data.message||('HTTP '+pr2.status));
  }catch(e){
    log('❌ 部署失败: '+e.message,'err');
    if(e.message.includes('Bad credentials')){log('Token 无效或已过期','warn');log('https://github.com/settings/tokens','warn')}
    else if(e.message.includes('Not Found')){log('仓库不存在或 Token 没有 repo 权限','warn');log('1. 确认仓库已创建','warn');log('2. 确认 Token 勾选了 repo 权限','warn')}
    setStatus('status-err','❌ 部署失败，查看日志');document.getElementById('deployBtn').disabled=false;
  }
}
function resetAll(){
  fileContent=null;fileName='';checksPassed=false;
  document.getElementById('fileInput').value='';document.getElementById('fileInfo').classList.remove('show');
  document.getElementById('checkCard').style.display='none';document.getElementById('deployBtn').disabled=true;
  document.getElementById('logBox').innerHTML='';document.getElementById('logBox').classList.remove('show');
  document.getElementById('commitMsg').value='';markStep(ghToken?2:1);setStatus('status-idle','⏳ 等待选择文件');
}
markStep(1);
</script>
