<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🛠️ HTML 生成器 V1.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#F5F7FA;color:#1A1A2E;min-height:100vh;display:flex;justify-content:center;padding:20px}
.app{max-width:760px;width:100%;transition:max-width .3s}
.app.with-preview{max-width:1280px}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:24px;color:#2D8B46;margin-bottom:6px}
.header p{font-size:13px;color:#6B7280}
.steps{display:flex;justify-content:center;gap:0;margin-bottom:28px}
.step{display:flex;align-items:center;gap:0}
.step-num{width:28px;height:28px;border-radius:50%;background:#2D8B46;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.step-text{font-size:13px;color:#374151;margin-left:8px;white-space:nowrap}
.step-arrow{color:#D1D5DB;margin:0 12px;font-size:14px}
.form-group{margin-bottom:20px}
.form-label{font-size:14px;font-weight:600;color:#374151;margin-bottom:8px;display:block}
.form-hint{font-size:12px;color:#9CA3AF;margin-top:4px}
.code-input{width:100%;height:480px;border:1.5px solid #E5E7EB;border-radius:10px;padding:14px;font-size:13px;font-family:'SF Mono',Monaco,Consolas,monospace;resize:vertical;outline:none;tab-size:2;line-height:1.6;background:#FAFAFA;color:#1A1A2E;transition:border-color .2s,background .2s}
.code-input:focus{border-color:#2D8B46;background:#fff}
.name-input{width:100%;padding:12px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s}
.name-input:focus{border-color:#2D8B46}
.name-row{display:flex;align-items:center;gap:0}
.name-row .name-input{flex:1;border-radius:10px 0 0 10px}
.name-row .ext{padding:12px 14px;background:#F3F4F6;border:1.5px solid #E5E7EB;border-left:none;border-radius:0 10px 10px 0;font-size:14px;color:#6B7280;font-weight:500}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn-download{flex:1;padding:14px;border:none;border-radius:10px;background:#2D8B46;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-download:hover{background:#246B38}
.btn-download:active{transform:scale(0.99)}
.btn-preview{padding:14px 20px;border:1.5px solid #2D8B46;border-radius:10px;background:#fff;color:#2D8B46;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-preview:hover{background:#F0FDF4}
.main-area{display:flex;gap:16px;align-items:flex-start}
.left-area{flex:1;min-width:0;max-width:760px;margin:0 auto;transition:all .3s}
.app.with-preview .left-area{max-width:600px;margin:0}
.preview-wrap{display:none;flex:1;min-width:0;position:sticky;top:20px}
.preview-wrap.show{display:block}
.preview-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.preview-close{font-size:12px;color:#9CA3AF;cursor:pointer;text-decoration:underline}
.preview-frame{width:100%;height:600px;border:1.5px solid #E5E7EB;border-radius:10px;background:#fff}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-ok{background:#D1FAE5;color:#059669}
.toast-err{background:#FEE2E2;color:#DC2626}
@media(max-width:768px){.main-area{flex-direction:column}.app.with-preview{max-width:680px}.app.with-preview .left-area{max-width:100%}.preview-wrap{position:static}.preview-frame{height:400px}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
<h1>🛠️ HTML 生成器 V1.3</h1>
<p>粘贴代码，命名文件，一键下载</p>
</div>
<div class="steps">
<div class="step"><div class="step-num">1</div><span class="step-text">粘贴代码</span></div>
<span class="step-arrow">→</span>
<div class="step"><div class="step-num">2</div><span class="step-text">输入文件名</span></div>
<span class="step-arrow">→</span>
<div class="step"><div class="step-num">3</div><span class="step-text">点击下载</span></div>
</div>
<div class="main-area">
<div class="left-area">
<div class="form-group">
<label class="form-label">📝 HTML 代码</label>
<textarea class="code-input" id="codeInput" placeholder="在此粘贴你的 HTML 代码..." spellcheck="false"></textarea>
<div class="form-hint">支持完整 HTML 文档或代码片段</div>
</div>
<div class="form-group">
<label class="form-label">📄 文件名称</label>
<div class="name-row">
<input type="text" class="name-input" id="fileName" placeholder="输入文件名" spellcheck="false" />
<span class="ext">.html</span>
</div>
<div class="form-hint">下载文件将命名为：你的输入.html</div>
</div>
<div class="btn-row">
<button class="btn-preview" onclick="togglePreview()">👁️ 预览</button>
<button class="btn-download" onclick="downloadHTML()">⬇️ 下载 HTML 文件</button>
</div>
</div>
<div class="preview-wrap" id="previewWrap">
<div class="preview-title"><span>👁️ 预览效果</span><span class="preview-close" onclick="closePreview()">关闭预览</span></div>
<iframe class="preview-frame" id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function togglePreview(){
  const code=document.getElementById('codeInput').value;
  if(!code.trim()){showToast('请先粘贴代码','err');return}
  const wrap=document.getElementById('previewWrap');
  if(wrap.classList.contains('show')){
    closePreview();
  }else{
    document.getElementById('preview').srcdoc=code;
    wrap.classList.add('show');
    document.getElementById('app').classList.add('with-preview');
  }
}
function closePreview(){
  document.getElementById('previewWrap').classList.remove('show');
  document.getElementById('preview').srcdoc='';
  document.getElementById('app').classList.remove('with-preview');
}
function downloadHTML(){
  const code=document.getElementById('codeInput').value;
  const name=document.getElementById('fileName').value.trim();
  if(!code.trim()){showToast('请先粘贴代码','err');return}
  if(!name){showToast('请输入文件名','err');return}
  let cleanName=name.replace(/[\\/:*?"<>|]/g,'').replace(/\.html?$/i,'').trim();
  if(!cleanName){showToast('文件名无效','err');return}
  const blob=new Blob([code],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=cleanName+'.html';a.click();
  URL.revokeObjectURL(url);
  showToast(cleanName+'.html 已下载','ok');
}
function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast toast-'+type+' show';
  setTimeout(()=>t.classList.remove('show'),2000);
}
document.getElementById('codeInput').addEventListener('keydown',function(e){
  if(e.key==='Tab'){e.preventDefault();const s=this.selectionStart,en=this.selectionEnd;this.value=this.value.substring(0,s)+'  '+this.value.substring(en);this.selectionStart=this.selectionEnd=s+2}
});
document.getElementById('fileName').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();downloadHTML()}
});
</script>
<script type="text/javascript" src="/accessproxy_statics/h5_fp.js" defer></script>
<script type="text/javascript" src="/accessproxy_statics/wm.js" defer></script>
</body>
</html>
